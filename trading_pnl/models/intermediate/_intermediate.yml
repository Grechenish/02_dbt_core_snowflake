version: 2

models:
  - name: int_stock_prices_daily
    description: >
      One row per ticker per trading day with open, high, low and close prices in USD plus volume,
      pivoted from the long staging format, including ticker-days without a close. Incremental: each run re-pivots and merges the last
      var('market_data_lookback_days') days. Only unadjusted prices are kept. The provider's adjusted
      prices are rewritten for the whole history after every split or dividend, which a lookback
      window can never pick up, so storing them incrementally would leave old rows silently wrong.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, trade_date]
    columns:
      - name: ticker
        description: "{{ doc('col_ticker') }}"
      - name: trade_date
        description: "{{ doc('col_price_trade_date') }}"
      - name: asset_class
        description: "{{ doc('col_asset_class') }}"
      - name: primary_exchange_name
        description: "{{ doc('col_primary_exchange_name') }}"
      - name: open_price
        description: "{{ doc('col_open_price') }}"
      - name: high_price
        description: "{{ doc('col_high_price') }}"
      - name: low_price
        description: "{{ doc('col_low_price') }}"
      - name: close_price
        description: >
          {{ doc('col_close_price_usd') }} Null for the few ticker-days the source delivers without
          prices. Those rows are kept and measured (monitoring_market_data_daily) rather than
          filtered out, because filtering here would make a not_null test meaningless.
      - name: volume
        description: "{{ doc('col_volume') }}"

  - name: int_trades_current
    description: >
      Every live trade in its latest version: amendments applied, cancelled trades removed. The
      direction is turned into a signed quantity and a cash flow in the book currency.
    columns:
      - name: trade_id
        description: "{{ doc('col_trade_id') }}"
        data_tests: [unique, not_null]
      - name: current_version
        description: Version of the trade these values come from (the highest one received).
      - name: book
        description: "{{ doc('col_book') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('books')
                field: book
      - name: trader
        description: "{{ doc('col_trader') }}"
        data_tests: [not_null]
      - name: instrument
        description: "{{ doc('col_instrument') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_stock_prices_daily')
                field: ticker
      - name: side
        description: Trade direction, `BUY` or `SELL`.
      - name: quantity
        description: Number of shares traded. Always positive; the direction comes from `side`.
      - name: signed_quantity
        description: "`+quantity` for a BUY and `-quantity` for a SELL."
      - name: price
        description: Execution price per share in the book currency.
      - name: currency
        description: "{{ doc('col_currency') }}"
      - name: trade_date
        description: Date the trade was executed. Can be earlier than the day it was booked (back-dated trades).
      - name: booked_at_utc
        description: When the latest version was booked, in UTC.
      - name: cash_flow
        description: >
          Cash moved by the trade in the book currency: `-signed_quantity × price`, so negative
          when buying (cash leaves the book) and positive when selling.

  - name: int_instrument_prices_filled
    description: >
      One row per traded instrument per trading day of the shared calendar, with the latest close
      price on or before that day (carried forward over days the instrument has no price of its own).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [instrument, calendar_date]
    columns:
      - name: instrument
        description: "{{ doc('col_instrument') }}"
      - name: calendar_date
        description: Trading day from dim_date.
      - name: has_own_price
        description: True when the instrument has its own close for this day, false when it is carried forward.
      - name: close_price_usd
        description: Close on this day, or the last close before it. Null only before the instrument's first price.
      - name: last_price_date
        description: Day close_price_usd comes from.
      - name: price_age_days
        description: "{{ doc('col_price_age_days') }}"

  - name: int_daily_position
    description: >
      One row per position (book / trader / instrument / currency) per trading day from its first
      trade onwards, on the shared trading calendar, so every position can be valued every day.
      Days without a trade are HOLD rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [book, trader, instrument, currency, position_date]
    columns:
      - name: book
        description: "{{ doc('col_book') }}"
      - name: trader
        description: "{{ doc('col_trader') }}"
      - name: instrument
        description: "{{ doc('col_instrument') }}"
      - name: currency
        description: "{{ doc('col_currency') }}"
      - name: position_date
        description: "{{ doc('col_position_date') }}"
      - name: action
        description: "{{ doc('col_action') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [BUY, SELL, HOLD, MIXED]
      - name: traded_quantity
        description: "{{ doc('col_traded_quantity') }}"
      - name: cash_flow
        description: "{{ doc('col_daily_cash_flow') }}"
      - name: shares_held
        description: "{{ doc('col_shares_held') }} A negative value would mean selling more than was bought."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: int_trading_pnl
    description: >
      Daily positions marked to market in the book currency, with cumulative cash and PnL, at full
      precision. FX uses the latest rate on or before each day (ASOF JOIN), because rates aren't
      published on every trading day.
    columns:
      - name: book
        description: "{{ doc('col_book') }}"
      - name: trader
        description: "{{ doc('col_trader') }}"
      - name: instrument
        description: "{{ doc('col_instrument') }}"
      - name: currency
        description: "{{ doc('col_currency') }}"
      - name: position_date
        description: "{{ doc('col_position_date') }}"
      - name: action
        description: "{{ doc('col_action') }}"
      - name: traded_quantity
        description: "{{ doc('col_traded_quantity') }}"
      - name: cash_flow
        description: "{{ doc('col_daily_cash_flow') }}"
      - name: shares_held
        description: "{{ doc('col_shares_held') }}"
      - name: close_price_usd
        description: "{{ doc('col_close_price_usd') }} Carried forward from last_price_date when the day has no price."
        # BLOCK: null means the instrument had no price yet when the position opened; it can't be valued
        data_tests: [not_null]
      - name: last_price_date
        description: Day the close price comes from.
      - name: price_age_days
        description: "{{ doc('col_price_age_days') }}"
      - name: usd_fx_rate
        description: "{{ doc('col_usd_fx_rate') }}"
        data_tests: [not_null]
      - name: close_price
        description: "{{ doc('col_close_price_book') }}"
      - name: market_value
        description: "{{ doc('col_market_value') }}"
      - name: cumulative_cash
        description: "{{ doc('col_cumulative_cash') }}"
      - name: pnl
        description: "{{ doc('col_pnl') }}"
