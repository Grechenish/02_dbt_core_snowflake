version: 2

# Unit tests run a model's SQL against the small fixtures below instead of warehouse data, so each
# business rule is checked against hand-computed results. `dbt build` runs them before building the
# model they test. To run only the unit tests: dbt test --select "test_type:unit"

unit_tests:
  - name: int_daily_position__holds_between_trades_and_tracks_shares
    description: >
      A BUY opens the position, trading days without a trade become HOLD rows, and a partial SELL
      reduces shares_held. Price days before the first trade and other tickers produce no rows.
    model: int_daily_position
    given:
      - input: ref('int_trading_book')
        rows:
          - {book: B1, trader: T1, instrument: AAPL, currency: GBP, trade_date: '2025-01-02', signed_quantity: 100, cash_flow: -10000}
          - {book: B1, trader: T1, instrument: AAPL, currency: GBP, trade_date: '2025-01-06', signed_quantity: -40, cash_flow: 4400}
      - input: ref('int_stock_prices_daily')
        rows:
          - {ticker: AAPL, trade_date: '2024-12-31'}  # before the first trade: no row
          - {ticker: AAPL, trade_date: '2025-01-02'}
          - {ticker: AAPL, trade_date: '2025-01-03'}
          - {ticker: AAPL, trade_date: '2025-01-06'}
          - {ticker: MSFT, trade_date: '2025-01-03'}  # another ticker: no row
    expect:
      rows:
        - {book: B1, instrument: AAPL, position_date: '2025-01-02', action: BUY,  traded_quantity: 100, cash_flow: -10000, shares_held: 100}
        - {book: B1, instrument: AAPL, position_date: '2025-01-03', action: HOLD, traded_quantity: 0,   cash_flow: 0,      shares_held: 100}
        - {book: B1, instrument: AAPL, position_date: '2025-01-06', action: SELL, traded_quantity: -40, cash_flow: 4400,   shares_held: 60}

  - name: int_daily_position__same_day_round_trip_is_mixed
    description: >
      Buys and sells on the same day that cancel out are labelled MIXED. Shares held stay the same,
      and the day's net cash (the realized result of the round trip) is kept.
    model: int_daily_position
    given:
      - input: ref('int_trading_book')
        rows:
          - {book: B1, trader: T1, instrument: AAPL, currency: GBP, trade_date: '2025-01-02', signed_quantity: 100, cash_flow: -10000}
          - {book: B1, trader: T1, instrument: AAPL, currency: GBP, trade_date: '2025-01-03', signed_quantity: 50,  cash_flow: -5100}
          - {book: B1, trader: T1, instrument: AAPL, currency: GBP, trade_date: '2025-01-03', signed_quantity: -50, cash_flow: 5200}
      - input: ref('int_stock_prices_daily')
        rows:
          - {ticker: AAPL, trade_date: '2025-01-02'}
          - {ticker: AAPL, trade_date: '2025-01-03'}
    expect:
      rows:
        - {position_date: '2025-01-02', action: BUY,   traded_quantity: 100, cash_flow: -10000, shares_held: 100}
        - {position_date: '2025-01-03', action: MIXED, traded_quantity: 0,   cash_flow: 100,    shares_held: 100}

  - name: int_trading_pnl__marks_to_market_with_latest_fx_rate
    description: >
      An EUR book uses the latest USD->EUR rate on or before each day: none is published on
      2025-01-03, so the 2025-01-02 rate applies, and the later EUR rate and the GBP rate are ignored.
      A USD book uses a rate of 1. pnl = market value + cumulative cash.
    model: int_trading_pnl
    given:
      - input: ref('int_daily_position')
        rows:
          - {book: B2, trader: T2, instrument: AAPL, currency: EUR, position_date: '2025-01-02', action: BUY,  traded_quantity: 10, cash_flow: -900, shares_held: 10}
          - {book: B2, trader: T2, instrument: AAPL, currency: EUR, position_date: '2025-01-03', action: HOLD, traded_quantity: 0,  cash_flow: 0,    shares_held: 10}
          - {book: B3, trader: T3, instrument: AAPL, currency: USD, position_date: '2025-01-03', action: BUY,  traded_quantity: 1,  cash_flow: -100, shares_held: 1}
      - input: ref('int_stock_prices_daily')
        rows:
          - {ticker: AAPL, trade_date: '2025-01-02', close_price: 100}
          - {ticker: AAPL, trade_date: '2025-01-03', close_price: 110}
      - input: ref('stg_public_data__fx_rates')
        rows:
          - {quote_currency: EUR, rate_date: '2025-01-02', fx_rate: 0.9}
          - {quote_currency: EUR, rate_date: '2025-01-06', fx_rate: 0.95}  # later rate: never used for earlier days
          - {quote_currency: GBP, rate_date: '2025-01-03', fx_rate: 0.8}   # other currency: ignored
    expect:
      rows:
        - {book: B2, position_date: '2025-01-02', usd_fx_rate: 0.9, close_price: 90,  market_value: 900, cumulative_cash: -900, pnl: 0}
        - {book: B2, position_date: '2025-01-03', usd_fx_rate: 0.9, close_price: 99,  market_value: 990, cumulative_cash: -900, pnl: 90}
        - {book: B3, position_date: '2025-01-03', usd_fx_rate: 1,   close_price: 110, market_value: 110, cumulative_cash: -100, pnl: 10}

  - name: int_stock_prices_daily__full_build_pivots_every_day
    description: >
      Without an existing table, every source day is pivoted to one row per ticker and day.
      Volume-only rows with no close price are dropped.
    model: int_stock_prices_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_public_data__stock_prices')
        rows:
          - {ticker: AAPL, trade_date: '2025-01-02', asset_class: Equity, primary_exchange_name: NASDAQ, variable: post-market_close, value: 100}
          - {ticker: AAPL, trade_date: '2025-01-02', asset_class: Equity, primary_exchange_name: NASDAQ, variable: nasdaq_volume, value: 5000}
          - {ticker: AAPL, trade_date: '2025-01-02', asset_class: Equity, primary_exchange_name: NASDAQ, variable: post-market_close_adjusted, value: 99}
          - {ticker: PSTR, trade_date: '2025-01-06', asset_class: Equity, primary_exchange_name: NASDAQ, variable: nasdaq_volume, value: 10}
    expect:
      rows:
        - {ticker: AAPL, trade_date: '2025-01-02', close_price: 100, volume: 5000}

  - name: int_stock_prices_daily__incremental_run_reads_only_the_lookback_window
    description: >
      On an incremental run the model only re-reads source days within var('market_data_lookback_days')
      of the newest day already stored, so a late or restated day inside the window is re-pivoted (and
      then merged over the old row), while older days are not touched.
    model: int_stock_prices_daily
    overrides:
      macros:
        is_incremental: true
      vars:
        market_data_lookback_days: 3
    given:
      - input: this
        rows:
          - {ticker: AAPL, trade_date: '2025-01-10', close_price: 105}
      - input: ref('stg_public_data__stock_prices')
        rows:
          # older than 2025-01-10 minus 3 days: outside the window, not re-read
          - {ticker: AAPL, trade_date: '2025-01-06', variable: post-market_close, value: 999}
          # inside the window: a restated price and a late-arriving day
          - {ticker: AAPL, trade_date: '2025-01-07', variable: post-market_close, value: 101.5}
          - {ticker: AAPL, trade_date: '2025-01-10', variable: post-market_close, value: 106}
          - {ticker: AAPL, trade_date: '2025-01-13', variable: post-market_close, value: 107}
    expect:
      rows:
        - {ticker: AAPL, trade_date: '2025-01-07', close_price: 101.5}
        - {ticker: AAPL, trade_date: '2025-01-10', close_price: 106}
        - {ticker: AAPL, trade_date: '2025-01-13', close_price: 107}
