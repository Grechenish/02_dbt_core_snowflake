version: 2

models:
  - name: stg_public_data__stock_prices
    description: >
      Daily price and volume variables for US-listed securities from Nasdaq trading data, since
      var('start_date'), with consistent column names. Still in long format: one row per ticker,
      day and variable. This one date filter controls data volume and cost for everything downstream.
    data_tests:
      # the MAX() pivot downstream would silently hide duplicated source rows
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, trade_date, variable]
    columns:
      - name: ticker
        description: "{{ doc('col_ticker') }}"
        data_tests: [not_null]
      - name: asset_class
        description: "{{ doc('col_asset_class') }}"
      - name: primary_exchange_code
        description: Code of the primary listing exchange.
      - name: primary_exchange_name
        description: "{{ doc('col_primary_exchange_name') }}"
      - name: variable
        description: >
          Which measure the row holds: open, high, low or close price (each also split/dividend
          adjusted), or Nasdaq volume. The pivot downstream ignores any other value.
        data_tests:
          - not_null
          # WARN, not BLOCK: a new variable is simply ignored by the pivot, which is harmless. A renamed
          # close variable is the dangerous case, and it shows up as missing closes, which
          # monitoring_market_data_daily blocks on.
          - accepted_values:
              config:
                severity: warn
              arguments:
                values:
                  - pre-market_open
                  - pre-market_open_adjusted
                  - all-day_high
                  - all-day_high_adjusted
                  - all-day_low
                  - all-day_low_adjusted
                  - post-market_close
                  - post-market_close_adjusted
                  - nasdaq_volume
      - name: trade_date
        description: "{{ doc('col_price_trade_date') }} Renamed from the source column `date`."
        data_tests: [not_null]
      - name: value
        description: The measure's value. Prices are in USD, volume in shares.

  - name: stg_public_data__fx_rates
    description: >
      USD -> report currency daily FX rates, starting 10 days before var('start_date') so that
      as-of lookups always have a prior rate for the first trading day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [quote_currency, rate_date]
    columns:
      - name: base_currency
        description: Always `USD`.
      - name: quote_currency
        description: Report currency the rate converts into, one of var('report_currencies').
      - name: quote_currency_name
        description: Full name of the quote currency.
      - name: rate_date
        description: >
          Day the rate was published. Rates are missing on some US trading days, such as ECB
          holidays, so models take the latest rate on or before each day.
      - name: fx_rate
        description: Units of the quote currency that one US dollar buys, e.g. 0.8773 EUR.
        data_tests: [not_null]
      - name: rate_source
        description: Publisher of the rate, from the source's `provenance` JSON, e.g. `ECB`.
      - name: rate_type
        description: How the rate was produced, from `provenance`, e.g. `Derived Inverse` or `Derived Cross`.

  - name: stg_trades__trade_versions
    description: >
      One row per trade version (trade_id + version) with every column cast to its type. Rows that
      arrived more than once (a replayed file) are kept once, from their first load. Casts use
      TRY_ functions, so a malformed value becomes NULL here and fails the not_null tests below
      instead of failing the whole query; _source_file and _source_row_number say where it came from.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_id, version]
    columns:
      - name: trade_id
        description: "{{ doc('col_trade_id') }}"
        data_tests: [not_null]
      - name: version
        description: Version of the trade. 1 is the original booking; every correction adds one.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: status
        description: "`NEW` for version 1, then `AMEND` (replaces the trade's values) or `CANCEL` (removes the trade)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NEW, AMEND, CANCEL]
      - name: book
        description: "{{ doc('col_book') }}"
        data_tests: [not_null]
      - name: trader
        description: "{{ doc('col_trader') }}"
        data_tests: [not_null]
      - name: instrument
        description: "{{ doc('col_instrument') }}"
        data_tests: [not_null]
      - name: side
        description: "`BUY` or `SELL`."
        data_tests:
          - accepted_values:
              arguments:
                values: [BUY, SELL]
      - name: quantity
        description: Number of shares, always positive. Cast to NUMBER(18, 0).
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: price
        description: Execution price per share in the book currency. Cast to NUMBER(18, 6), never FLOAT.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: currency
        description: "{{ doc('col_currency') }}"
        data_tests: [not_null]
      - name: trade_date
        description: Date the trade was executed.
        data_tests: [not_null]
      - name: booked_at_utc
        description: When this version was booked, converted to UTC.
        data_tests: [not_null]
      - name: _source_file
        description: File this version was first loaded from.
      - name: _source_row_number
        description: Row number inside that file.
      - name: _load_run_id
        description: Loader run (RAW.TRADES.LOAD_RUNS) that first loaded it.
      - name: _loaded_at
        description: When it was first loaded.
      - name: times_loaded
        description: >
          How many times this version arrived in RAW. More than 1 means a file was replayed; the
          extra copies are dropped here.
