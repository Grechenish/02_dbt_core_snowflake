name: 'trading_pnl'
version: '1.0.0'
profile: 'trading_pnl'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2025-01-01'          # how far back to load source data
  report_currencies: ['EUR', 'GBP'] # USD prices are converted into these
  # Days of market data the incremental models re-read and re-merge on every run, counted back from the
  # newest day already loaded. Provisional value: see docs/decisions.md ("Lookback window") for the
  # reasoning, and analyses/market_data_restatement_depth.sql for how to measure the real figure.
  market_data_lookback_days: 30
  # How far back the restatement check compares the stored prices with the source.
  restatement_check_days: 90

seeds:
  trading_pnl:
    +schema: seeds

models:
  trading_pnl:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
