version: 2

seeds:
  - name: books
    description: >
      Reference list of trading books (desks) and the currency each one reports in. Static
      reference data that changes rarely and is edited by hand, which is what dbt seeds are for.
      Trades are not seeds: they arrive daily as files and go through ingestion/load_trades.py.
    config:
      column_types:
        book: varchar
        desk_name: varchar
        base_currency: varchar(3)
    columns:
      - name: book
        description: "{{ doc('col_book') }}"
        data_tests: [unique, not_null]
      - name: desk_name
        description: Name of the desk that owns the book.
      - name: base_currency
        description: Currency the book's positions, cash and PnL are reported in.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [USD, EUR, GBP]
