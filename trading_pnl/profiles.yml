# Connection settings per environment. Nothing secret is stored here: it all comes from
# environment variables (see ../.env.example). Each environment has its own Snowflake user, role,
# warehouse and database, so a run can only write where its role allows (snowflake/03_roles_and_grants.sql).
trading_pnl:
  target: dev
  outputs:
    # A person working locally, logged in as themselves through the browser (SSO, or password + MFA).
    # Builds into ANALYTICS_DEV in schema DEV_<USER>, so developers never touch each other's tables.
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: externalbrowser
      role: developer
      warehouse: dev_wh
      database: analytics_dev
      schema: "{{ env_var('DBT_SCHEMA', 'DEV_' ~ env_var('SNOWFLAKE_USER') | upper) }}"
      threads: 4

    # Pull-request checks in GitHub Actions. Builds into ANALYTICS_DEV.CI_PR_<number>; the
    # role has no write access to production at all, only the read access --defer and clone need.
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: svc_dbt_ci
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: transformer_ci
      warehouse: dev_wh
      database: analytics_dev
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4

    # The daily GitHub Actions run. Service user with key-pair authentication.
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: svc_dbt_prod
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: transformer_prod
      warehouse: transform_wh
      database: analytics
      schema: public  # unused: every model folder sets its own schema
      threads: 4
