name: ci

# Fast checks on every pull request and push to main. No Snowflake credentials are needed,
# so this also runs for pull requests from forks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t dbt-hol .

      # dbt parse renders every model, test, macro and config without connecting to Snowflake,
      # so placeholder credentials are enough. --warn-error turns deprecations and other warnings into failures.
      - name: Parse dbt project
        run: |
          docker run --rm \
            -e SNOWFLAKE_ACCOUNT=ci-placeholder -e SNOWFLAKE_PASSWORD=ci-placeholder \
            dbt-hol --warn-error parse
