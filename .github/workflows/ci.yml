name: ci

# Every pull request is checked twice before it can merge:
#   1. static checks: SQL lint, loader tests, Docker image build and dbt parse. No Snowflake access needed.
#   2. dbt build on Snowflake: the changed models and everything downstream of them are built and
#      tested in the pull request's own schema (ANALYTICS_DEV.CI_PR_<number>), reading unchanged
#      models from production. ci-cleanup.yml drops those schemas when the pull request closes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels its older, now outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # sqlfluff gets its own virtualenv: it pins an older click than dbt, so they can't share one.
      - name: Lint SQL
        run: |
          python -m venv /tmp/lint
          /tmp/lint/bin/pip install --quiet -r requirements-lint.txt
          /tmp/lint/bin/sqlfluff lint trading_pnl/models trading_pnl/tests trading_pnl/analyses

      - name: Test the trade loader
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
          pytest
          python ingestion/load_trades.py --dry-run

      - name: Build image
        run: docker build -t trading-pnl .

      # dbt parse renders every model, test, macro and config without connecting to Snowflake,
      # so placeholder credentials are enough. --warn-error turns deprecations and other warnings into failures.
      - name: Parse dbt project
        run: |
          docker run --rm \
            -e SNOWFLAKE_ACCOUNT=ci-placeholder -e SNOWFLAKE_USER=ci-placeholder \
            trading-pnl --warn-error parse

  snowflake-build:
    name: dbt build on Snowflake
    needs: static-checks
    # Secrets aren't available to pull requests from forks, or to Dependabot's (they get only
    # Dependabot secrets), so those only get the static checks. Dependabot only bumps actions.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read         # to download the production manifest from the daily workflow
      pull-requests: read   # to read the pull request's labels
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DBT_CI_PRIVATE_KEY }}
      DBT_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
    steps:
      # Checkout first: the summary step at the end runs even when this job fails early.
      - uses: actions/checkout@v7

      - name: Check Snowflake secrets are configured
        run: |
          missing=""
          [ -n "$SNOWFLAKE_ACCOUNT" ] || missing="$missing SNOWFLAKE_ACCOUNT"
          [ -n "$SNOWFLAKE_PRIVATE_KEY" ] || missing="$missing SNOWFLAKE_DBT_CI_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing (see docs/CI_CD.md, Setting it up)"
            exit 1
          fi

      - name: Build image
        run: docker build -t trading-pnl .

      # The manifest of the last successful production run describes what production looks like.
      # dbt compares this branch against it to find the modified models (state:modified).
      - name: Fetch production manifest
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prod-state
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dbt-daily.yml --branch main \
                     --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name prod-manifest --dir prod-state; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No production manifest yet: building the whole project."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The full-refresh label rebuilds the changed incremental models from scratch. A PR that
      # changes their columns needs it: on_schema_change='fail' stops an incremental run on a
      # table with the old columns. Production then needs the same (docs/RUNBOOK.md). The labels
      # are read live, not from the event, so "Re-run all jobs" after adding the label picks it up.
      - name: Check for the full-refresh label
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," == *",full-refresh,"* ]]; then
            echo "full_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt build (changed models and their children)
        env:
          STATE_FOUND: ${{ steps.state.outputs.found }}
          FULL_REFRESH: ${{ steps.labels.outputs.full_refresh }}
        run: |
          mkdir -p artifacts && chmod 777 artifacts   # the container runs as a non-root user
          run_dbt() {
            docker run --rm -e SNOWFLAKE_ACCOUNT -e SNOWFLAKE_PRIVATE_KEY -e DBT_SCHEMA \
              -v "$PWD/prod-state:/app/prod-state:ro" -v "$PWD/artifacts:/app/trading_pnl/target" \
              trading-pnl "$@"
          }
          refresh=()
          [ "$FULL_REFRESH" = "true" ] && refresh=(--full-refresh)
          if [ "$STATE_FOUND" = "true" ]; then
            if [ "$FULL_REFRESH" != "true" ]; then
              # Changed incremental models start from a zero-copy clone of production, so their
              # incremental branch (not a full rebuild) is what gets tested, against real data.
              # --full-refresh re-clones on every run: without it, a table left in the CI schema
              # by an earlier run is kept.
              run_dbt clone --full-refresh --target ci --state /app/prod-state \
                --select "state:modified+,config.materialized:incremental"
            else
              # Unit tests read their `this` fixture's columns from the existing table, so create
              # the changed incremental tables, empty and with their new columns, first.
              run_dbt run --target ci --state /app/prod-state --defer --favor-state --full-refresh --empty \
                --select "state:modified+,config.materialized:incremental"
            fi
            # Build what changed plus everything downstream. Models read unchanged parents from
            # production (--defer); --favor-state does so even when an earlier run of this PR left
            # an older copy of them in the CI schema. (Unit-test fixtures still take their columns
            # from such a copy.)
            run_dbt build --target ci --state /app/prod-state --defer --favor-state \
              --select "state:modified+" "${refresh[@]}"
          else
            # Unit tests of an incremental model's incremental branch read the existing table's
            # columns, so create the incremental tables (empty, with their parents) before the
            # first full build.
            run_dbt run --target ci --select +config.materialized:incremental --empty "${refresh[@]}"
            run_dbt build --target ci "${refresh[@]}"
          fi

      - name: Summarize run
        if: always()
        run: .github/scripts/dbt_run_summary.sh "dbt build ($DBT_SCHEMA)" artifacts/run_results.json

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-dbt-run-results
          path: |
            artifacts/run_results.json
            artifacts/manifest.json
          if-no-files-found: ignore
