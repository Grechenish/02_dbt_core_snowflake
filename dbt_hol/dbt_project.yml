
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_hol'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_hol'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  start_date: '2025-01-01'          # how far back to load source data
  report_currencies: ['EUR', 'GBP'] # USD prices are converted into these
  pnl_lookback_days: 7              # fct_trading_pnl re-merges this many days on incremental runs
  heavy_warehouse_size: 'SMALL'     # fct_trading_pnl pre-hook scales the target warehouse to this (guide uses XXLARGE)

seeds:
  dbt_hol:
    +schema: seeds

models:
  dbt_hol:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
      # heavy pivots/joins run on the LARGE warehouse of the current environment
      +snowflake_warehouse: "{{ 'dbt_prod_heavy_wh' if target.name == 'prod' else 'dbt_dev_heavy_wh' }}"
    marts:
      +schema: marts
      +materialized: table
